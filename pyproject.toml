[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sub-autotranslate-tool"
version = "0.1.0"
description = "End-to-end AI translation of SRT/ASS subtitle files via OpenRouter LLMs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests[socks]>=2.31",
]

[project.scripts]
sub-autotranslate-tool = "sub_autotranslate_tool.cli:main"
mkv-sub-extract = "sub_autotranslate_tool.mkvextract:main"

[tool.setuptools.packages.find]
include = ["sub_autotranslate_tool*"]
